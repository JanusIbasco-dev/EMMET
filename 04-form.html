<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <label for="student-id">Student ID:</label>
        <input type="text" id="student-id" name="student_id" placeholder="Enter your student ID">
        <br><br>

        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full_name" placeholder="Enter your full name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        <br><br>

        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </fieldset>
        <br>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="bsit">BS Information Technology</option>
            <option value="bscs">BS Computer Science</option>
            <option value="bsece">BS Electronics Engineering</option>
        </select>
        <br><br>

        <fieldset>
            <legend>Hobbies</legend>
            <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
            <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
            <label><input type="checkbox" name="hobbies" value="music"> Music</label>
            <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
        </fieldset>
        <br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
        <br><br>

        <input type="submit" value="Register">
    </form>
</body>
</html>
